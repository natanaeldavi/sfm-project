<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFM — Entrar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>SFM</h1>
    <p class="subtitulo">Shop Floor Management</p>

    <div id="alertaLogin" hidden></div>

    <form id="formLogin">
      <div class="campo" id="campoCodigoWrap">
        <label for="campoCodigo">Código</label>
        <input type="text" id="campoCodigo" autocomplete="username" required>
      </div>

      <div class="campo" id="campoSenhaWrap" hidden>
        <label for="campoSenha">Senha</label>
        <input type="password" id="campoSenha" autocomplete="current-password">
      </div>

      <div id="blocoPrimeiroAcesso" hidden>
        <p class="subtitulo" style="margin-top:0;">Primeiro acesso — crie sua senha.</p>
        <div class="campo">
          <label for="campoNovaSenha">Nova senha</label>
          <input type="password" id="campoNovaSenha" autocomplete="new-password">
        </div>
        <div class="campo">
          <label for="campoConfirmarSenha">Confirmar nova senha</label>
          <input type="password" id="campoConfirmarSenha" autocomplete="new-password">
        </div>
      </div>

      <button type="submit" id="btnEntrar" style="width:100%;">Entrar</button>
      <button type="button" id="btnTrocarCodigo" class="secundario" style="width:100%;margin-top:8px;" hidden>&larr; Trocar código</button>
    </form>

    <p class="rodape-nota">Autenticação local, sem servidor — apenas para organizar o uso do sistema.</p>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/db-ui.js"></script>
<script src="js/login.js"></script>
</body>
</html>

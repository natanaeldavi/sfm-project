<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFM — Menu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar" id="topbar"></header>

<main>
  <div id="dbStatus" class="db-status"></div>
  <div id="alerta" hidden></div>

  <div class="card" id="cardSetor" hidden>
    <h2>Setor</h2>
    <p class="subtitulo">Escolha o setor antes de continuar.</p>
    <div class="campo" style="max-width:260px;">
      <label for="seletorSetor">Setor</label>
      <select id="seletorSetor"></select>
    </div>
  </div>

  <div class="card">
    <h2>O que você quer fazer?</h2>
    <div class="acoes-menu">
      <a href="passar-turno.html" class="acao-card" id="linkPassarTurno" title="Registrar ordens do seu setor que ficam abertas para o próximo turno">
        <span class="icone">&#8594;</span>Passar Turno
      </a>
      <a href="receber-turno.html" class="acao-card" id="linkReceberTurno" title="Ver e finalizar ordens deixadas pelo turno anterior">
        <span class="icone">&#8592;</span>Receber Turno
      </a>
      <a href="quadro-sfm.html" class="acao-card" id="linkQuadroSfm" title="Levantamento da SFM — folha SQDC do mês, igual à que fica exposta no quadro do setor">
        <span class="icone">&#128203;</span>SFM
      </a>
    </div>
  </div>

  <div class="card" id="cardGestao" hidden>
    <h2>Gestão</h2>
    <div class="acoes-menu">
      <a href="relatorios.html" class="acao-card" id="linkRelatorios" hidden>
        <span class="icone">&#128203;</span>Relatórios
      </a>
      <a href="admin.html" class="acao-card" id="linkAdmin" hidden>
        <span class="icone">&#9881;</span>Administração
      </a>
    </div>
  </div>
</main>

<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/db-ui.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
